server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: points-mall

  datasource:
    url: jdbc:h2:mem:pointsmall;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: points-mall-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  security:
    user:
      name: admin
      password: admin123

redis:
  host: localhost
  port: 6379
  password:
  timeout: 3000
  pool:
    max-active: 10
    max-idle: 5
    min-idle: 1
    max-wait: 2000

jwt:
  secret: points-mall-secret-key-for-jwt-signing-2024
  expiration: 86400000

points:
  earn:
    purchase-rate: 10
    review-bonus: 50
    signin-bonus: 5
  expire:
    days: 365

kafka:
  topics:
    points-earned: points.earned
    points-spent: points.spent
    order-created: order.created
    order-completed: order.completed

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.cyberrange.pointsmall: DEBUG
    org.springframework.kafka: INFO
    redis.clients: INFO
