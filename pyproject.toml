[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyber-range-builder"
version = "0.1.0"
description = "AI-powered cyber range target builder using Terraform"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
crb = "main:cli"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
